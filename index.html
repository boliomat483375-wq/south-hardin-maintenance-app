<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#870d13"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SH Maintenance"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.png?v=4" type="image/png"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=4"><title>South Hardin Maintenance · Demo</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#26191a;background:#f7eeee}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:720px;min-height:100dvh;margin:auto;background:white;display:flex;flex-direction:column}.top{background:#870d13;color:white;padding:20px 18px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px}.logo{background:#b51220;padding:12px;border-radius:12px;color:#fff}.sub{font-size:12px;opacity:.75;font-weight:400}.top select{width:100%;margin-top:18px;padding:11px;border-radius:9px;border:1px solid #ffffff55;background:#a3242b;color:white}main{flex:1;padding:20px 16px 35px}.nav{display:grid;grid-template-columns:repeat(5,1fr);position:sticky;bottom:0;background:white;border-top:1px solid #ddd}.nav:has(button:nth-child(3):last-child){grid-template-columns:repeat(3,1fr)}.nav:has(button:nth-child(4):last-child){grid-template-columns:repeat(4,1fr)}.nav button{background:none;border:0;padding:13px 0;font-size:11px;color:#806c6d}.nav button.active{color:#b51220;background:#fff0f0;font-weight:800}.nav span{display:block;font-size:21px}h2{font-size:23px;margin:0 0 5px}.muted{color:#806c6d;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0}.metric,.card{border:1px solid #e8d7d8;border-radius:12px;padding:14px;background:white}.metric b{display:block;font-size:29px}.primary{background:#b51220;color:white;border:0;border-radius:10px;padding:13px 16px;font-weight:700}.secondary{background:white;border:1px solid #d8c4c5;border-radius:10px;padding:10px;color:#8c1620}.full{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.job{text-align:left;width:100%;color:inherit}.job strong{display:block;margin:8px 0}.pill{display:inline-block;padding:5px 9px;border-radius:25px;font-size:11px;font-weight:700;background:#ffebee;color:#8d1420}.Open{background:#ffebee;color:#a01926}.InProgress{background:#ffe1e3;color:#8d1420}.Completed{background:#ffe5e5;color:#8d1420}.High{background:#fee2e2;color:#991b1b}.Medium{background:#fff1cb;color:#8a5800}.Low{background:#fff0f0;color:#8d1420}label{display:block;font-size:13px;font-weight:700;margin:15px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d8c4c5;border-radius:9px;background:white;color:#870d13}textarea{min-height:90px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.filters button{padding:8px;font-size:12px}.section{margin:22px 0 12px}.small{font-size:12px}.notice{padding:13px;border-radius:10px;background:#fff2f2;color:#80666a;font-size:13px;margin-top:15px}@media(min-width:740px){.shell{margin:24px auto;min-height:calc(100dvh - 48px);border-radius:16px;overflow:hidden;box-shadow:0 8px 40px #49090d20}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="logo" aria-label="South Hardin red SH logo">SH</div><div>South Hardin<div class="sub">Maintenance Hub · Unofficial Demo</div></div></div><label for="role" style="color:white;margin:15px 0 5px">Switch demo account</label><select id="role" aria-label="Switch demo account" style="margin-top:0"><option value="Administrator">Administrator</option><option value="Custodian">Custodian</option><option value="Teacher">Teacher</option></select><select id="school"><option value="All">All district locations</option><option>Middle School</option><option>High School</option><option>Elementary</option></select></header><main id="content"></main><nav class="nav" id="nav"></nav></div><script src="./app.js?v=8"></script></body></html>
